
name: Track Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            executable: track.exe

          - os: ubuntu-22.04
            platform: linux
            executable: track

          - os: macos-latest
            platform: macos
            executable: track

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: |
          python -m PyInstaller --clean --onefile --name track track.py

      - name: Package executable

        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          executable = Path("dist") / os.environ["EXECUTABLE"]
          output_dir = Path("packages")
          output_dir.mkdir(exist_ok=True)

          if not executable.is_file():
              raise FileNotFoundError(f"Executable not found: {executable}")

          archive = output_dir / f"track-{os.environ['PLATFORM']}.zip"

          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zip_file:
              zip_file.write(executable, executable.name)

              for filename in ("README.md", "LICENSE"):
                  file = Path(filename)
                  if file.is_file():
                      zip_file.write(file, file.name)

          print(f"Created {archive}")
          PY

      - name: Upload packaged executable
        uses: actions/upload-artifact@v7
        with:
          name: track-${{ matrix.platform }}
          path: packages/track-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all builds
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create source ZIP
        run: |
          mkdir -p release-assets
          git archive --format=zip \
            --output=release-assets/track-source.zip HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Track ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true
